<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Casual Shoes</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }
    nav {
      background: #222;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #fff;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card-content {
      padding: 20px;
      text-align: center;
    }
    .card-content h3 {
      margin: 10px 0;
      font-size: 1.2rem;
    }
    .price {
      color: #e63946;
      font-size: 1.1rem;
      font-weight: bold;
    }
    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Premium Casual Shoes</h1>
    <p>For Men & Women</p>
  </header>
  <nav>
    <a href="#">Home</a>
    <a href="#">Men</a>
    <a href="#">Women</a>
    <a href="#">Brands</a>
    <a href="#">Contact</a>
  </nav>
  <section class="container">
    <div class="card">
      <img src="nike-shoes.jpg" alt="Nike Casual Shoes">
      <div class="card-content">
        <h3>Nike Air Casual</h3>
        <p class="price">$120</p>
      </div>
    </div>
    <div class="card">
      <img src="adidas-shoes.jpg" alt="Adidas Casual Shoes">
      <div class="card-content">
        <h3>Adidas Street Style</h3>
        <p class="price">$110</p>
      </div>
    </div>
    <div class="card">
      <img src="puma-shoes.jpg" alt="Puma Casual Shoes">
      <div class="card-content">
        <h3>Puma Everyday Comfort</h3>
        <p class="price">$95</p>
      </div>
    </div>
    <div class="card">
      <img src="kappa-shoes.jpg" alt="Kappa Casual Shoes">
      <div class="card-content">
        <h3>Kappa Urban Walk</h3>
        <p class="price">$85</p>
      </div>
    </div>
  </section>
  <footer>
    <p>&copy; 2026 Premium Casual Shoes. All Rights Reserved.</p>
  </footer>
</body>
</html>
